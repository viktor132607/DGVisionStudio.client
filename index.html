<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="DG Vision Studio – фотография и визуално съдържание за брандове, продукти, кампании, портрети и събития."
    />
    <meta
      name="keywords"
      content="DG Vision Studio, фотограф, фотография, видеография, портретна фотография, сватбена фотография, продуктова фотография, България"
    />
    <meta name="author" content="DG Vision Studio" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/png" href="/images/Pronto1.png" />

    <meta property="og:site_name" content="DG Vision Studio" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DG Vision Studio" />
    <meta
      property="og:description"
      content="DG Vision Studio – фотография и визуално съдържание за брандове, продукти, кампании, портрети и събития."
    />
    <meta property="og:image" content="https://dgvisionstudio.com/og-cover.jpg" />
    <meta property="og:url" content="https://dgvisionstudio.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DG Vision Studio" />
    <meta
      name="twitter:description"
      content="DG Vision Studio – фотография и визуално съдържание за брандове, продукти, кампании, портрети и събития."
    />
    <meta name="twitter:image" content="https://dgvisionstudio.com/og-cover.jpg" />

    <script>
      (() => {
        const platform = navigator.userAgentData?.platform ?? navigator.platform ?? ""
        const isAppleDevice = /Mac|iPhone|iPad|iPod/i.test(`${platform} ${navigator.userAgent}`)

        if (isAppleDevice) {
          document.documentElement.classList.add("apple-device")
        }
      })()
    </script>

    <style>
      html.apple-device header.fixed > div:first-child > div.flex {
        height: 58px !important;
      }

      html.apple-device header.fixed > div[class*="max-h-"] {
        max-height: calc(100vh - 58px) !important;
      }

      @media (min-width: 768px) {
        html.apple-device header.fixed > div:first-child > div.flex {
          height: 61px !important;
        }
      }

      @media (min-width: 768px) and (max-width: 1279px) {
        html.apple-device header.fixed > div:nth-of-type(2) > div {
          padding-top: 10px !important;
          padding-bottom: 10px !important;
        }

        html.apple-device header.fixed > div:nth-of-type(2) [class*="min-h-"] {
          min-height: 34px !important;
        }
      }

      @media (min-width: 1280px) {
        html.apple-device header.fixed > div:first-child > div.flex {
          height: 67px !important;
        }

        html.apple-device header.fixed nav a::after {
          bottom: -19px !important;
        }
      }

      @media (min-width: 1536px) {
        html.apple-device header.fixed > div:first-child > div.flex {
          height: 70px !important;
        }

        html.apple-device header.fixed nav a::after {
          bottom: -18px !important;
        }
      }
    </style>

    <title>DG Vision Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/admin-calendar-modal.js" defer></script>
    <script src="/admin-dashboard-calendar-layout.js" defer></script>
    <script src="/admin-calendar-interactions.js" defer></script>
  </body>
</html>
